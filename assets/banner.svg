<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Scanner Line Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#374151" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspect */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes scan {
      0% { transform: translateY(0px); }
      50% { transform: translateY(180px); }
      100% { transform: translateY(0px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }

    @keyframes rotateIcon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Applying Animations */
    .bg-grid {
      animation: pulse 6s infinite ease-in-out;
    }
    .scanner-line {
      animation: scan 4s infinite ease-in-out;
    }
    .node-pulse {
      animation: blink 2s infinite ease-in-out;
    }
    .gear-rotate {
      transform-origin: 100px 100px;
      animation: rotateIcon 20s infinite linear;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      fill: url(#accent-grad);
      filter: drop-shadow(0px 2px 8px rgba(139, 92, 246, 0.3));
    }
    .sub-text {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
      fill: #9CA3AF;
      letter-spacing: 2px;
      animation: float 4s infinite ease-in-out;
    }
    .icon-glow {
      filter: url(#glow);
    }
  </style>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg-grad)" />
  <rect width="800" height="200" fill="url(#grid)" class="bg-grid" />

  <!-- Abstract Tech Decorations (Left Side) -->
  <g transform="translate(40, 0)">
    <!-- Circuit lines -->
    <path d="M 30 50 L 90 50 L 120 80 L 120 120 L 90 150 L 30 150" fill="none" stroke="#1F2937" stroke-width="2" />
    <path d="M 60 70 L 100 70 L 110 80 L 110 110 L 100 120 L 60 120" fill="none" stroke="url(#accent-grad)" stroke-width="1" stroke-dasharray="4 2" />

    <!-- Pulse Nodes -->
    <circle cx="90" cy="50" r="3.5" fill="#3B82F6" class="node-pulse" style="animation-delay: 0s;" />
    <circle cx="120" cy="80" r="3.5" fill="#8B5CF6" class="node-pulse" style="animation-delay: 0.5s;" />
    <circle cx="120" cy="120" r="3.5" fill="#EC4899" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="90" cy="150" r="3.5" fill="#3B82F6" class="node-pulse" style="animation-delay: 1.5s;" />

    <!-- Core Rotating Tech Gear / Radar -->
    <g class="gear-rotate">
      <circle cx="100" cy="100" r="40" fill="none" stroke="#1F2937" stroke-width="1.5" />
      <circle cx="100" cy="100" r="30" fill="none" stroke="url(#accent-grad)" stroke-width="1" stroke-dasharray="10 5" />
      <circle cx="100" cy="100" r="20" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="40 10" />
      <circle cx="100" cy="100" r="5" fill="#EC4899" class="icon-glow" />
    </g>
  </g>

  <!-- Scanner Line Effect (Dynamic Aspect) -->
  <line x1="0" y1="10" x2="800" y2="10" stroke="url(#scan-grad)" stroke-width="3" class="scanner-line" />

  <!-- Banner Typography (Right Side / Center) -->
  <g transform="translate(260, 95)">
    <text x="0" y="0" font-size="34" class="title-text">FILE ACTIVITY MONITORING</text>
    <text x="3" y="32" font-size="12" class="sub-text">CURATED REGISTRY OF ENTERPRISE &amp; OPEN-SOURCE SOLUTIONS</text>
  </g>

  <!-- Abstract Graph Nodes (Right Corner) -->
  <g transform="translate(680, 50)" opacity="0.6">
    <line x1="10" y1="50" x2="60" y2="20" stroke="#374151" stroke-width="1" />
    <line x1="60" y1="20" x2="90" y2="80" stroke="#374151" stroke-width="1" />
    <line x1="90" y1="80" x2="40" y2="110" stroke="#374151" stroke-width="1" />
    <line x1="40" y1="110" x2="10" y2="50" stroke="#374151" stroke-width="1" />
    <line x1="60" y1="20" x2="40" y2="110" stroke="#374151" stroke-width="1" />

    <circle cx="10" cy="50" r="5" fill="#8B5CF6" class="node-pulse" style="animation-delay: 0.2s;" />
    <circle cx="60" cy="20" r="6" fill="#3B82F6" class="node-pulse" style="animation-delay: 0.8s;" />
    <circle cx="90" cy="80" r="4" fill="#EC4899" class="node-pulse" style="animation-delay: 1.4s;" />
    <circle cx="40" cy="110" r="5" fill="#10B981" class="node-pulse" style="animation-delay: 0.5s;" />
  </g>
</svg>
